<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3F3F46" stroke-width="0.75" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="url(#bgGrad)" />
  <rect width="1200" height="700" fill="url(#grid)" />

  <!-- Hardware Setup Illustration -->
  <g transform="translate(600, 350)">
    <!-- Desk Surface Line -->
    <line x1="-480" y1="140" x2="480" y2="140" stroke="#3F3F46" stroke-width="3" />

    <!-- Center Monitor (Dual Display Setup) -->
    <g transform="translate(-80, 0)">
      <rect x="-120" y="-130" width="240" height="150" rx="10" fill="#18181B" stroke="#71717A" stroke-width="3" />
      <rect x="-110" y="-120" width="220" height="130" rx="6" fill="#27272A" />
      <path d="M -15 20 L 15 20 L 25 140 L -25 140 Z" fill="#3F3F46" />
      <rect x="-45" y="135" width="90" height="10" rx="3" fill="#52525B" />
      
      <!-- Screen Graphic: Terminal / Code / System Info -->
      <rect x="-95" y="-105" width="190" height="14" rx="3" fill="#3F3F46" />
      <circle cx="-85" cy="-98" r="3" fill="#EF4444" />
      <circle cx="-75" cy="-98" r="3" fill="#F59E0B" />
      <circle cx="-65" cy="-98" r="3" fill="#10B981" />
      <text x="-95" y="-60" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E879F9">CPU: 16-Core vPro</text>
      <text x="-95" y="-40" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A1A1AA">RAM: 32GB DDR5</text>
      <text x="-95" y="-20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">NVMe: 1TB PCIe 4.0</text>
    </g>

    <!-- Laptop (Workstation companion) -->
    <g transform="translate(180, 50)">
      <rect x="-70" y="-70" width="140" height="90" rx="6" fill="#18181B" stroke="#C026D3" stroke-width="2.5" />
      <rect x="-62" y="-62" width="124" height="74" rx="3" fill="#27272A" />
      <path d="M -80 20 L 80 20 L 70 30 L -70 30 Z" fill="#3F3F46" />
      <rect x="-15" y="22" width="30" height="5" rx="1" fill="#71717A" />
    </g>

    <!-- Server Tower / NAS Rack on the Left -->
    <g transform="translate(-360, 20)">
      <rect x="-55" y="-170" width="110" height="240" rx="10" fill="#18181B" stroke="#C026D3" stroke-width="2.5" />
      <line x1="-50" y1="-110" x2="50" y2="-110" stroke="#3F3F46" stroke-width="1.5" />
      <line x1="-50" y1="-50" x2="50" y2="-50" stroke="#3F3F46" stroke-width="1.5" />
      <line x1="-50" y1="10" x2="50" y2="10" stroke="#3F3F46" stroke-width="1.5" />
      
      <!-- Hard Drive Bays -->
      <circle cx="-35" cy="-140" r="4" fill="#10B981" />
      <rect x="-20" y="-145" width="60" height="10" rx="2" fill="#27272A" stroke="#52525B" stroke-width="1" />
      
      <circle cx="-35" cy="-80" r="4" fill="#10B981" />
      <rect x="-20" y="-85" width="60" height="10" rx="2" fill="#27272A" stroke="#52525B" stroke-width="1" />
      
      <circle cx="-35" cy="-20" r="4" fill="#10B981" />
      <rect x="-20" y="-25" width="60" height="10" rx="2" fill="#27272A" stroke="#52525B" stroke-width="1" />

      <circle cx="-35" cy="40" r="4" fill="#C026D3" />
      <text x="5" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E879F9" text-anchor="middle">RAID NAS</text>
    </g>

    <!-- UPS Power Battery Unit on the Right -->
    <g transform="translate(360, 60)">
      <rect x="-45" y="-80" width="90" height="140" rx="8" fill="#18181B" stroke="#71717A" stroke-width="2" />
      <rect x="-35" y="-65" width="70" height="35" rx="4" fill="#27272A" />
      <text x="0" y="-45" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">230V OK</text>
      <circle cx="-20" cy="5" r="4" fill="#10B981" />
      <text x="5" y="9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#A1A1AA">ONLINE</text>
      <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#E879F9" text-anchor="middle">UPS SURGE</text>
    </g>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(60, 80)">
    <rect width="320" height="42" rx="21" fill="#18181B" stroke="#3F3F46" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#C026D3" />
    <text x="40" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FAF7F2" letter-spacing="0.5">IT HARDWARE PROCUREMENT</text>
  </g>
</svg>
